[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-agent"
version = "0.1.0"
description = "AI agent that turns a product brief into a 9:16 video ad with motion graphics and voiceover."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abdimalik Salad Hussein" }]
dependencies = ["Pillow>=10.1"]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
voice = ["edge-tts>=6.1"]
dev = ["pytest>=8"]

[project.scripts]
ad-agent = "ad_agent.cli:main"

[tool.setuptools]
packages = ["ad_agent"]
